# version: "3.9"

services:
  train:
    image: mini-siem:latest
    build: .
    command: python tools/train_ml.py
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    profiles: ["train"]

  # --- SIEM Agent (log monitor) ---
  agent:
    image: mini-siem:latest
    command: python main.py
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./models:/app/models
    # NIDS requires host network + privileged for raw packet capture
    network_mode: host
    privileged: true
    restart: unless-stopped
    depends_on:
      - dashboard

  # --- Web Dashboard ---
  dashboard:
    image: mini-siem:latest
    build: .
    command: python dashboard.py
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    restart: unless-stopped
