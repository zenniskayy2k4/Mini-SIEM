# version: "3.9"

services:
  train:
    image: mini-siem:latest
    build: .
    command: python tools/train_ml.py
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    profiles: ["train"]

  # --- SIEM Agent (log monitor) ---
  agent:
    image: mini-siem:latest
    command: python main.py
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./models:/app/models
      - ./config/rules:/app/config/rules:ro
      - ./config/sigma:/app/config/sigma:ro
    # NIDS requires host network + privileged for raw packet capture
    network_mode: host
    privileged: true
    restart: unless-stopped
    depends_on:
      - dashboard

  # --- Web Dashboard ---
  dashboard:
    image: mini-siem:latest
    build: .
    command: python dashboard.py
    env_file:
      - .env
    environment:
      DASHBOARD_HOST: ${DASHBOARD_HOST:-0.0.0.0}
      WINDOWS_COLLECTOR_SECRET: ${WINDOWS_COLLECTOR_SECRET:-}
      WINDOWS_COLLECTOR_STALE_SECONDS: ${WINDOWS_COLLECTOR_STALE_SECONDS:-60}
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET:-}
      DASHBOARD_COOKIE_SECURE: ${DASHBOARD_COOKIE_SECURE:-false}
      ALERT_RETENTION_DAYS: ${ALERT_RETENTION_DAYS:-90}
      INGESTION_FAILURE_RETENTION_DAYS: ${INGESTION_FAILURE_RETENTION_DAYS:-30}
      LOG_ROTATE_MAX_BYTES: ${LOG_ROTATE_MAX_BYTES:-10485760}
      LOG_ROTATE_BACKUPS: ${LOG_ROTATE_BACKUPS:-5}
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./config/rules:/app/config/rules:ro
      - ./config/sigma:/app/config/sigma:ro
    restart: unless-stopped
