id: DET-SSH-001
title: SSH Brute Force Attempt
enabled: true
severity: HIGH
source_type: HIDS_LOG
mitre:
  tactic: Credential Access
  technique: T1110.001
match:
  regex: 'Failed password for (?:invalid user )?(?P<user>\S+) from (?P<ip>\d{1,3}(?:\.\d{1,3}){3})'
threshold:
  count: SSH_BRUTE_FORCE_THRESHOLD
  window_seconds: SSH_BRUTE_FORCE_WINDOW_SECONDS
description: Repeated failed SSH logins from one source.
extract_ip: true
