<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <meta name="current-role" content="{{ current_role or '' }}">
    <title>SIEM Pro | SOC Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Favicons -->
    <link rel="icon" href="{{ url_for('static', filename='favicons/favicon.ico') }}" type="image/x-icon" />
    <link rel="icon" href="{{ url_for('static', filename='favicons/favicon-32x32.png') }}" sizes="32x32" type="image/png"/>
    <link rel="icon" href="{{ url_for('static', filename='favicons/favicon-16x16.png') }}" sizes="16x16" type="image/png"/>
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='favicons/apple-touch-icon.png') }}" />
    <link rel="icon" href="{{ url_for('static', filename='favicons/android-chrome-192x192.png') }}" sizes="192x192" type="image/png"/>
    <link rel="icon" href="{{ url_for('static', filename='favicons/android-chrome-512x512.png') }}" sizes="512x512" type="image/png" />
    <link rel="manifest" href="{{ url_for('static', filename='favicons/site.webmanifest') }}" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-shield-virus"></i>
                <span class="logo-label">SIEM<span class="highlight">PRO</span></span>
            </div>
            
            <nav>
                <a href="/" class="{{ 'active' if page == 'dashboard' else '' }}"{% if page == 'dashboard' %} aria-current="page"{% endif %}>
                    <i class="fa-solid fa-chart-pie"></i><span class="nav-label">Dashboard</span>
                </a>
                <a href="/logs" class="{{ 'active' if page == 'logs' else '' }}"{% if page == 'logs' %} aria-current="page"{% endif %}>
                    <i class="fa-solid fa-list-ul"></i><span class="nav-label">Live Logs</span>
                </a>
                <a href="/analytics" class="{{ 'active' if page == 'analytics' else '' }}"{% if page == 'analytics' %} aria-current="page"{% endif %}>
                    <i class="fa-solid fa-chart-line"></i><span class="nav-label">Analytics</span>
                </a>
                <a href="/graph" class="{{ 'active' if page == 'graph' else '' }}"{% if page == 'graph' %} aria-current="page"{% endif %}>
                    <i class="fa-solid fa-diagram-project"></i><span class="nav-label">Graph</span>
                </a>
                {% if current_role in ['analyst', 'admin'] %}
                    <a href="/detections" class="{{ 'active' if page == 'detections' else '' }}"{% if page == 'detections' %} aria-current="page"{% endif %}>
                        <i class="fa-solid fa-sliders"></i><span class="nav-label">Detections</span>
                    </a>
                {% endif %}
                {% if current_role == 'admin' %}
                    <a href="/assets" class="{{ 'active' if page == 'assets' else '' }}"{% if page == 'assets' %} aria-current="page"{% endif %}>
                        <i class="fa-solid fa-server"></i><span class="nav-label">Assets</span>
                    </a>
                    <a href="/settings" class="{{ 'active' if page == 'settings' else '' }}"{% if page == 'settings' %} aria-current="page"{% endif %}>
                        <i class="fa-solid fa-gear"></i><span class="nav-label">Settings</span>
                    </a>
                {% endif %}
            </nav>

            <div class="sidebar-footer">
                <div class="session-user">
                    <strong>{{ current_username }}</strong>
                    <span>{{ current_role }}</span>
                </div>
                <form action="{{ url_for('logout') }}" method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button class="logout-button" type="submit"><i class="fa-solid fa-right-from-bracket"></i><span class="logout-label">Logout</span></button>
                </form>
                <div class="status-badge">
                    <span class="pulse-dot"></span> System Online
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content" id="main-content" tabindex="-1">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Main JS -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
