<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIEM Pro | SOC Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-shield-virus"></i>
                <span>SIEM<span class="highlight">PRO</span></span>
            </div>
            
            <nav>
                <a href="/" class="{{ 'active' if page == 'dashboard' else '' }}">
                    <i class="fa-solid fa-chart-pie"></i> Dashboard
                </a>
                <a href="/logs" class="{{ 'active' if page == 'logs' else '' }}">
                    <i class="fa-solid fa-list-ul"></i> Live Logs
                </a>
                <a href="/settings" class="{{ 'active' if page == 'settings' else '' }}">
                    <i class="fa-solid fa-gear"></i> Settings
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="status-badge">
                    <span class="pulse-dot"></span> System Online
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Main JS -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
