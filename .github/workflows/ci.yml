name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OLLAMA_API_KEY: ""
      NOTIFICATION_WEBHOOK_URL: ""
      RESPONSE_MODE: simulation

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q config src tools tests dashboard.py main.py

      - name: Check JavaScript syntax
        run: node --check static/js/app.js

      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose --profile train config --quiet

      - name: Run regression modules
        shell: bash
        run: |
          for test_file in tests/test_*.py; do
            test_module="${test_file%.py}"
            python -m "${test_module//\//.}"
          done

  docker-smoke:
    needs: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OLLAMA_API_KEY: ""
      NOTIFICATION_WEBHOOK_URL: ""
      RESPONSE_MODE: simulation

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare CI-safe runtime
        run: |
          cp .env.example .env
          mkdir -p data logs
          printf '%s\n' '{"NIDS_ENABLED":false,"HONEYPOT_ENABLED":false}' > data/runtime_settings.json

      - name: Build Docker services
        run: docker compose build

      - name: Start Docker services
        run: docker compose up -d

      - name: Wait for healthy stack
        shell: bash
        run: |
          for attempt in {1..30}; do
            health="$(curl --fail --silent --show-error http://localhost:5000/health || true)"
            if [[ "$health" == *'"status":"healthy"'* &&
                  "$health" == *'"agent":"healthy"'* &&
                  "$health" == *'"dashboard":"healthy"'* &&
                  "$health" == *'"database":"healthy"'* ]]; then
              echo "$health"
              exit 0
            fi
            sleep 2
          done
          echo "Stack did not become healthy in 60 seconds" >&2
          exit 1

      - name: Verify dashboard and SQLite
        run: |
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:5000/login)" = "200"
          docker compose exec -T dashboard python -c "import sqlite3; c=sqlite3.connect('/app/data/mini_siem.db'); assert c.execute('PRAGMA quick_check(1)').fetchone()[0] == 'ok'; assert c.execute('SELECT name FROM sqlite_master WHERE name=?', ('alerts',)).fetchone()"

      - name: Collect Docker logs on failure
        if: failure()
        run: |
          mkdir -p ci-logs
          docker compose ps -a > ci-logs/compose-ps.txt || true
          docker compose logs --no-color > ci-logs/compose.log || true

      - name: Upload Docker logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: docker-smoke-logs
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Stop Docker services
        if: always()
        run: docker compose down --volumes --remove-orphans

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reject tracked runtime files
        shell: bash
        run: |
          tracked="$(git ls-files -- .env 'data/**' 'logs/**')"
          if [[ -n "$tracked" ]]; then
            echo "Runtime files must not be tracked:" >&2
            echo "$tracked" >&2
            exit 1
          fi

      - name: Scan repository secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Audit Python dependencies
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt
