title: Suspicious Rundll32 JavaScript Execution
id: 673bbb22-3691-438e-8849-99b4a59d5145
status: test
description: Detects rundll32 executing a JavaScript payload.
author: Mini-SIEM
tags:
  - attack.defense_evasion
  - attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    EventID: 1
    Image|endswith: '\rundll32.exe'
    CommandLine|contains: 'javascript:'
  condition: selection
level: high
