title: Encoded PowerShell With Hidden Window
id: b48b53d4-6bfb-4d0a-af2b-12ddeb0e7bb6
status: test
description: Detects hidden encoded PowerShell execution.
author: Mini-SIEM
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    EventID: 1
    Image|endswith: '\powershell.exe'
    CommandLine|contains|all:
      - ' -nop'
      - ' -encodedcommand'
  condition: selection
level: high
